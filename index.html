<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Oficina</title>
<meta name="theme-color" content="#2a2420">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Oficina">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 30%, #4a3d30, #1d1814 70%) #2a2420;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #c { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none; }
  #cargando { position: fixed; inset: 0; display: grid; place-items: center; color: #e9dcc8; font-size: 15px; transition: opacity .6s; pointer-events: none; }
  #cargando.fuera { opacity: 0; }

  /* ---------- Intercomunicador ---------- */
  #interfono {
    position: fixed; right: 28px; top: 50%; transform: translateY(-50%); z-index: 5;
    width: 260px; padding: 14px; border-radius: 18px;
    background: linear-gradient(160deg, rgba(58,63,75,.92), rgba(35,38,46,.92));
    backdrop-filter: blur(8px); border: 1px solid #4a505e;
    box-shadow: 0 24px 40px -16px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.35);
    color: #e9edf5; transition: opacity .35s, transform .35s;
  }
  #interfono.oculto { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(30px); }
  .if-tit { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #9ea6b8; margin: 0 4px 10px; }
  .if-btn {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 10px 12px; margin-top: 8px; border-radius: 12px; cursor: pointer;
    border: 1px solid #555c6c; color: inherit; font: inherit;
    background: linear-gradient(180deg, #4a5060, #353a46);
    box-shadow: 0 4px 0 #1c1f26, inset 0 1px 0 rgba(255,255,255,.1);
    transition: transform .08s, box-shadow .08s;
  }
  .if-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1c1f26; }
  .if-av { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 19px;
    background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c), #fff 30%) inset; }
  .if-txt { flex: 1; line-height: 1.2; }
  .if-txt b { display: block; font-size: 15px; }
  .if-txt small { color: #aab2c3; font-size: 12px; }
  .if-led { width: 9px; height: 9px; border-radius: 50%; background: #7ee0a1; box-shadow: 0 0 8px #7ee0a1; flex: none; }

  /* ---------- Avisos y bocadillo ---------- */
  #aviso {
    position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; z-index: 6;
    transform: translate(-50%, -20px); opacity: 0; transition: .35s;
    background: rgba(20,22,28,.85); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 15px; backdrop-filter: blur(6px); white-space: nowrap;
  }
  #aviso.ver { opacity: 1; transform: translate(-50%, 0); }
  #bocadillo {
    position: fixed; left: 0; top: 0; z-index: 6; max-width: min(270px, 64vw);
    background: #fff; color: #1f2430; padding: 12px 16px; border-radius: 18px 18px 18px 4px;
    font-size: 15px; line-height: 1.35; box-shadow: 0 12px 28px -10px rgba(0,0,0,.45);
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #bocadillo.ver { opacity: 1; }

  /* ---------- Pantallita de la llamada ---------- */
  #pantalla {
    position: fixed; z-index: 7; right: 3vw; top: 5vh; bottom: 5vh; width: min(480px, 42vw);
    display: flex; flex-direction: column; border-radius: 22px; overflow: hidden;
    background: #15171c; border: 10px solid #15171c;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.8), 0 0 0 1px #3a3f4b;
    transform: translateX(115%); transition: transform .55s cubic-bezier(.2,.9,.3,1);
  }
  #pantalla.ver { transform: none; }
  .pt-cab { display: flex; align-items: center; gap: 10px; padding: 4px 4px 12px; color: #e9edf5; }
  .pt-dot { width: 10px; height: 10px; border-radius: 50%; background: #7ee0a1; box-shadow: 0 0 8px #7ee0a1; flex: none; }
  .pt-txt { flex: 1; min-width: 0; line-height: 1.2; }
  .pt-txt b { display: block; font-size: 16px; }
  .pt-txt span { font-size: 12px; color: #9ea6b8; font-variant-numeric: tabular-nums; }
  .pt-txt a { color: #9cc2ff; text-decoration: none; margin-left: 6px; font-size: 12px; }
  #colgar {
    border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; flex: none;
    background: #e5484d; color: #fff; font: 700 14px/1 inherit; box-shadow: 0 6px 16px -6px #e5484d;
  }
  #ptCuerpo { flex: 1; position: relative; border-radius: 12px; overflow: hidden; background: #fff; }
  #ptCuerpo iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
  #ptCuerpo iframe.activo { display: block; }

  /* ---------- Tablet: visor de la bodega 3D ---------- */
  #visor {
    position: fixed; z-index: 9; inset: max(4vh, env(safe-area-inset-top)) 4vw 4vh;
    display: flex; flex-direction: column; border-radius: 30px; overflow: hidden;
    background: #111316; border: 14px solid #111316;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,.85), 0 0 0 2px #2e333d;
    opacity: 0; transform: scale(.85) translateY(40px); pointer-events: none;
    transition: opacity .35s, transform .45s cubic-bezier(.2,.9,.3,1);
  }
  #visor.ver { opacity: 1; transform: none; pointer-events: auto; }
  .vs-cab { display: flex; align-items: center; gap: 10px; padding: 0 4px 12px; color: #e9edf5; }
  .vs-cab b { flex: 1; font-size: 16px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 420px) { .vs-vivo { display: none; } }
  .vs-vivo { font-size: 12px; color: #ff6b6b; font-weight: 700; letter-spacing: .05em; }
  .vs-vivo::before { content: "●"; margin-right: 5px; animation: vivo 1.2s infinite; }
  @keyframes vivo { 50% { opacity: .3; } }
  .vs-cab a { color: #9cc2ff; text-decoration: none; font-size: 13px; }
  #visorCerrar { border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; background: #3a3f4b; color: #fff; font: 700 14px/1 inherit; }
  #visorCuerpo { flex: 1; position: relative; border-radius: 14px; overflow: hidden; background: #000; }
  #visorCuerpo iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #visorCuerpo .vs-falta { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #c9d1e0; font-size: 15px; line-height: 1.5; }
  #pista {
    position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none;
    background: rgba(20,22,28,.85); color: #fff; font-size: 13px; padding: 7px 12px; border-radius: 999px;
    backdrop-filter: blur(6px); white-space: nowrap; opacity: 0; transition: opacity .3s;
  }
  #pista.ver { opacity: 1; animation: flota 1.6s ease-in-out infinite; }
  @keyframes flota { 50% { margin-top: -6px; } }

  @media (orientation: portrait) {
    #ifBotones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .if-btn { margin-top: 0; padding: 8px 10px; gap: 8px; }
    .if-av { width: 32px; height: 32px; font-size: 16px; }
    .if-txt b { font-size: 14px; }
    .if-txt small, .if-led { display: none; }
    #visor { inset: max(10px, env(safe-area-inset-top)) 8px max(10px, env(safe-area-inset-bottom)); border-width: 10px; border-radius: 24px; }
    #interfono { top: auto; right: 12px; left: 12px; bottom: max(16px, env(safe-area-inset-bottom)); width: auto; transform: none; }
    #interfono.oculto { transform: translateY(30px); }
    #pantalla { left: 8px; right: 8px; top: auto; bottom: max(8px, env(safe-area-inset-bottom)); width: auto; height: 60dvh; transform: translateY(115%); }
    #pantalla.ver { transform: none; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<canvas id="c"></canvas>
<div id="cargando">Preparando tu oficina…</div>

<aside id="interfono" aria-label="Intercomunicador">
  <div class="if-tit">📟 Intercomunicador</div>
  <div id="ifBotones"></div>
</aside>

<div id="aviso" role="status"></div>
<div id="bocadillo" role="status"></div>

<section id="pantalla" aria-label="Llamada">
  <div class="pt-cab">
    <span class="pt-dot"></span>
    <div class="pt-txt"><b id="ptNombre"></b><span id="ptReloj">00:00</span><a id="ptAparte" target="_blank" rel="noopener" title="Abrir en otra pestaña si el micrófono no funciona">Abrir aparte ↗</a></div>
    <button id="colgar">Colgar</button>
  </div>
  <div id="ptCuerpo"></div>
</section>

<div id="pista">📱 Toca la tablet: Bodega 3D</div>

<section id="visor" aria-label="Bodega 3D">
  <div class="vs-cab">
    <b>📦 Bodega 3D</b><span class="vs-vivo">EN VIVO</span>
    <a id="visorAparte" target="_blank" rel="noopener">Abrir aparte ↗</a>
    <button id="visorCerrar">✕ Cerrar</button>
  </div>
  <div id="visorCuerpo"></div>
</section>

<script type="module">
  // ==========================================================
  //  TUS ASISTENTES
  //  - nombre / rol / saludo: lo que se ve y lo que dice al entrar.
  //  - pelo: "corto", "largo" o "gorra".  gafas: true / false.
  //  Para el de tutoriales: quita las // de su bloque y pon la URL.
  // ==========================================================
  const ASISTENTES = [
    { id: "pedidos", nombre: "Pedidos", rol: "Pedidos de muebles", icono: "🛋️",
      color: "#e07a3f", piel: "#f1c27d", colorPelo: "#3b2416", pelo: "largo", gafas: false,
      saludo: "¡Hola! Soy tu asistente de pedidos. ¿Qué pedido revisamos?",
      url: "https://nre130826-maker.github.io/asistente-pedidos/" },
    { id: "bodega", nombre: "Bodega", rol: "Inventario y existencias", icono: "📦",
      color: "#2a9d8f", piel: "#c98e62", colorPelo: "#1c1c1c", pelo: "gorra", gafas: false,
      saludo: "¡Buenas! Aquí bodega. ¿Qué producto quieres consultar?",
      url: "https://nre130826-maker.github.io/asistente-bodega/" },
    { id: "personal", nombre: "Personal", rol: "Tu asistente personal", icono: "🧑‍💼",
      color: "#7b61ff", piel: "#f5d0b0", colorPelo: "#6b3e26", pelo: "corto", gafas: true,
      saludo: "¡Hola, jefe! ¿En qué te ayudo hoy?",
      url: "https://nre130826-maker.github.io/asistente-voz-personal-DAN-/" },
    { id: "produccion", nombre: "Producción", rol: "Órdenes de producción", icono: "🏭",
      color: "#d4a017", piel: "#e0ac85", colorPelo: "#2b1d14", pelo: "gorra", gafas: true,
      saludo: "¡Hola! Aquí producción. ¿Qué orden revisamos?",
      url: "https://nre130826-maker.github.io/asistente-produccion/" },
    // { id: "tutoriales", nombre: "Tutoriales", rol: "Ayuda con AppSheet", icono: "📘",
    //   color: "#3a86ff", piel: "#e8b98f", colorPelo: "#2b1d14", pelo: "corto", gafas: false,
    //   saludo: "¡Hola! ¿Qué quieres aprender de AppSheet?",
    //   url: "https://nre130826-maker.github.io/NOMBRE-DEL-REPO/" },
  ];
  // ==========================================================
  //  TABLET DEL ESCRITORIO: pon aquí el enlace de tu bodega 3D
  // ==========================================================
  const BODEGA_3D = "https://nre130826-maker.github.io/bodega-peim/";
  // ==========================================================

  const $ = id => document.getElementById(id);

  /* ================= Interfaz (funciona aunque falle el 3D) ================= */
  let escena3D = null; // se rellena cuando carga el 3D

  ASISTENTES.forEach(a => {
    const b = document.createElement("button");
    b.className = "if-btn"; b.style.setProperty("--c", a.color);
    b.innerHTML = `<span class="if-av">${a.icono}</span><span class="if-txt"><b>${a.nombre}</b><small>${a.rol}</small></span><span class="if-led"></span>`;
    b.onclick = () => llamar(a);
    $("ifBotones").appendChild(b);
  });

  let audio = null;
  function timbre() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audio.currentTime + .05;
      for (let i = 0; i < 2; i++) {
        const g = audio.createGain(), ini = t0 + i * .8;
        g.gain.setValueAtTime(0, ini); g.gain.linearRampToValueAtTime(.06, ini + .02);
        g.gain.setValueAtTime(.06, ini + .45); g.gain.linearRampToValueAtTime(0, ini + .5);
        g.connect(audio.destination);
        [440, 480].forEach(f => { const o = audio.createOscillator(); o.frequency.value = f; o.connect(g); o.start(ini); o.stop(ini + .52); });
      }
    } catch (e) {}
  }
  function aviso(t) { const el = $("aviso"); if (t) { el.textContent = t; el.classList.add("ver"); } else el.classList.remove("ver"); }
  let bocadilloOn = false;
  function bocadillo(t) {
    const el = $("bocadillo");
    if (t) { el.textContent = t; bocadilloOn = true; el.classList.add("ver"); }
    else { el.classList.remove("ver"); bocadilloOn = false; }
  }

  let estado = "libre", tms = [], reloj = null, enLlamada = false;
  const marcos = {};
  const despues = (ms, fn) => tms.push(setTimeout(fn, ms));
  const limpiar = () => { tms.forEach(clearTimeout); tms = []; };

  function llamar(a) {
    if (estado !== "libre") return;
    estado = "entrando";
    $("interfono").classList.add("oculto");
    aviso(`📞 Llamando a ${a.nombre}…`);
    timbre();
    if (!escena3D) { despues(1200, () => { aviso(""); abrirPantalla(a); }); return; }
    escena3D.entrar(a, {
      sentado: () => aviso(""),
      saludo: () => { bocadillo(a.saludo); escena3D.hablar(2000); escena3D.saludar(); despues(2600, () => bocadillo("")); },
      listo: () => abrirPantalla(a),
    });
  }

  function abrirPantalla(a) {
    estado = "llamada"; enLlamada = true;
    $("ptNombre").textContent = a.icono + " " + a.nombre;
    $("ptAparte").href = a.url;
    if (!marcos[a.id]) {
      const f = document.createElement("iframe");
      f.src = a.url; f.title = a.nombre;
      f.allow = "microphone; camera; autoplay; clipboard-read; clipboard-write";
      $("ptCuerpo").appendChild(f); marcos[a.id] = f;
    }
    Object.values(marcos).forEach(m => m.classList.toggle("activo", m === marcos[a.id]));
    $("pantalla").classList.add("ver");
    const ini = Date.now();
    const pinta = () => { const s = Math.floor((Date.now() - ini) / 1000); $("ptReloj").textContent = "En llamada · " + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
    pinta(); clearInterval(reloj); reloj = setInterval(pinta, 1000);
  }

  function colgar() {
    if (estado === "libre" || estado === "saliendo") return;
    limpiar(); clearInterval(reloj);
    $("pantalla").classList.remove("ver"); enLlamada = false;
    aviso("");
    const fin = () => { estado = "libre"; $("interfono").classList.remove("oculto"); };
    if (!escena3D) { fin(); return; }
    if (estado === "entrando") { bocadillo(""); escena3D.reiniciar(); fin(); return; }
    estado = "saliendo";
    bocadillo("¡Hasta luego! Aquí estoy si me necesitas."); escena3D.hablar(1100);
    despues(1400, () => bocadillo(""));
    escena3D.salir(fin);
  }
  $("colgar").onclick = colgar;

  /* ---------- Tablet / visor de la bodega ---------- */
  let visorAbierto = false;
  function abrirVisor() {
    if (visorAbierto) return;
    visorAbierto = true;
    const cuerpo = $("visorCuerpo");
    if (!cuerpo.firstChild) {
      if (BODEGA_3D.startsWith("http")) {
        const f = document.createElement("iframe");
        f.src = BODEGA_3D; f.title = "Bodega 3D";
        f.allow = "fullscreen; accelerometer; gyroscope; xr-spatial-tracking; autoplay";
        cuerpo.appendChild(f);
      } else cuerpo.innerHTML = '<div class="vs-falta"><div>Falta el enlace de la bodega 3D.<br>Ponlo en el código, en la línea <b>BODEGA_3D</b>.</div></div>';
    }
    $("visorAparte").href = BODEGA_3D.startsWith("http") ? BODEGA_3D : "#";
    $("visor").classList.add("ver");
    $("interfono").classList.add("oculto");
  }
  function cerrarVisor() {
    if (!visorAbierto) return;
    visorAbierto = false;
    $("visor").classList.remove("ver");
    if (estado === "libre") $("interfono").classList.remove("oculto");
    if (escena3D) escena3D.alejarTablet();
  }
  $("visorCerrar").onclick = cerrarVisor;
  addEventListener("keydown", e => { if (e.key === "Escape") { if (visorAbierto) cerrarVisor(); else colgar(); } });

  /* ================= Escena 3D ================= */
  let THREE, RoundedBoxGeometry, RoomEnvironment;
  try {
    THREE = await import("three");
    ({ RoundedBoxGeometry } = await import("three/addons/geometries/RoundedBoxGeometry.js"));
    ({ RoomEnvironment } = await import("three/addons/environments/RoomEnvironment.js"));
    iniciar3D();
  } catch (e) {
    console.warn("Sin 3D:", e);
    $("cargando").textContent = "";
  }

  function iniciar3D() {
    const movil = matchMedia("(pointer: coarse)").matches;
    const canvas = $("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, movil ? 1.75 : 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#2a2420");
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 50);

    /* ---------- Utilidades ---------- */
    const mat = (color, rough = .8, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0, envMapIntensity: .55, ...extra });
    function malla(geo, material, pos = [0, 0, 0], padre = scene, opts = {}) {
      const m = new THREE.Mesh(geo, material);
      m.position.set(...pos);
      if (opts.rot) m.rotation.set(...opts.rot);
      if (opts.esc) m.scale.set(...opts.esc);
      m.castShadow = opts.sombra !== false; m.receiveShadow = true;
      padre.add(m); return m;
    }
    const caja = (w, h, d, r = .02) => r > 0 ? new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2, h / 2, d / 2)) : new THREE.BoxGeometry(w, h, d);
    const capsula = (r, l) => new THREE.CapsuleGeometry(r, l, 6, 14);
    const esfera = (r, ws = 24, hs = 16) => new THREE.SphereGeometry(r, ws, hs);
    function cilindroEntre(a, b, r, material, padre) {
      const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
      const len = va.distanceTo(vb);
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), material);
      m.position.copy(va).add(vb).multiplyScalar(.5);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vb.clone().sub(va).normalize());
      m.castShadow = true; padre.add(m); return m;
    }
    function textura(w, h, dibujar, rep) {
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      dibujar(cv.getContext("2d"), w, h);
      const t = new THREE.CanvasTexture(cv);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); }
      return t;
    }
    function madera(base, vetas, tablas = 8) {
      return (g, w, h) => {
        const alto = h / tablas;
        for (let i = 0; i < tablas; i++) {
          const v = (Math.random() - .5) * 18;
          g.fillStyle = `hsl(${base[0]}, ${base[1]}%, ${base[2] + v * .3}%)`;
          g.fillRect(0, i * alto, w, alto);
          g.strokeStyle = vetas; g.globalAlpha = .18; g.lineWidth = 1;
          for (let k = 0; k < 7; k++) {
            g.beginPath(); const y0 = i * alto + Math.random() * alto;
            g.moveTo(0, y0);
            for (let x = 0; x <= w; x += 32) g.lineTo(x, y0 + Math.sin(x / 50 + k) * 3);
            g.stroke();
          }
          g.globalAlpha = .5; g.fillStyle = vetas; g.fillRect(0, i * alto, w, 2);
          const corte = Math.random() * w; g.fillRect(corte, i * alto, 2, alto);
          g.globalAlpha = 1;
        }
      };
    }

    /* ---------- Luces ---------- */

        malla(new THREE.BoxGeometry(.03, .006, .006), negro, [0, .025, .17], cabeza, { sombra: false });
      }
      // Auriculares con micrófono
      malla(new THREE.TorusGeometry(.172, .011, 8, 32, Math.PI), negro, [0, .01, -.01], cabeza);
      [-1, 1].forEach(s => malla(new THREE.CylinderGeometry(.045, .045, .04, 20), negro, [s * .168, 0, 0], cabeza, { rot: [0, 0, Math.PI / 2] }));
      cilindroEntre([-.17, -.03, .02], [-.05, -.085, .14], .006, negro, cabeza);
      malla(esfera(.014), negro, [-.045, -.087, .145], cabeza);
      // Brazos y piernas
      const brazo = s => {
        const hombro = new THREE.Group(); hombro.position.set(s * .23, .41, 0); torso.add(hombro);
        malla(capsula(.055, .2), manga, [0, -.13, 0], hombro);
        const codo = new THREE.Group(); codo.position.y = -.27; hombro.add(codo);
        malla(capsula(.05, .16), manga, [0, -.1, 0], codo);
        malla(esfera(.055), piel, [0, -.24, 0], codo, { esc: [.9, 1.1, .8] });
        return { hombro, codo };
      };
      const pierna = s => {
        const art = new THREE.Group(); art.position.set(s * .095, -.03, 0); cadera.add(art);
        malla(capsula(.075, .3), pant, [0, -.21, 0], art);
        const rodilla = new THREE.Group(); rodilla.position.y = -.43; art.add(rodilla);
        malla(capsula(.065, .3), pant, [0, -.2, 0], rodilla);
        malla(caja(.11, .08, .25, .035), negro, [0, -.43, .045], rodilla);
        return { art, rodilla };
      };
      const p = { raiz, cadera, torso, cabeza, ojos, boca, bI: brazo(-1), bD: brazo(1), pI: pierna(-1), pD: pierna(1) };
      raiz.visible = false;
      scene.add(raiz);
      return p;
    }

    /* ---------- Movimiento del personaje ---------- */
    const SILLA = new THREE.Vector3(0, 0, -.82);
    const RUTA = [[-4.4, -1.6], [-2.6, -1.6], [-1.0, -.55], [0, -.36]].map(([x, z]) => new THREE.Vector3(x, 0, z));
    const anim = { modo: "oculto", s: 0, sentar: 0, andar: 0, fase: 0, saludo: 0, habla: 0, rumbo: Math.PI / 2, ruta: RUTA, alFinal: null, sentarObj: 0 };
    let puertaObj = 0, puertaAng = 0;

    function largoRuta(r) { let l = 0; for (let i = 1; i < r.length; i++) l += r[i].distanceTo(r[i - 1]); return l; }
    function puntoRuta(r, s) {
      for (let i = 1; i < r.length; i++) {
        const l = r[i].distanceTo(r[i - 1]);
        if (s <= l) return { p: r[i - 1].clone().lerp(r[i], s / l), dir: r[i].clone().sub(r[i - 1]) };
        s -= l;
      }
      return { p: r[r.length - 1].clone(), dir: r[r.length - 1].clone().sub(r[r.length - 2]), fin: true };
    }
    const esperas = [];
    const luego = (seg, fn) => esperas.push({ t: seg, fn });

    const api = {
      entrar(a, cb) {
        if (npc) { scene.remove(npc.raiz); }
        npc = crearPersonaje(a);
        Object.assign(anim, { modo: "espera", s: 0, sentar: 0, sentarObj: 0, andar: 0, saludo: 0, habla: 0, rumbo: Math.PI / 2, ruta: RUTA });
        npc.raiz.position.copy(RUTA[0]);
        esperas.length = 0;
        luego(.9, () => { puertaObj = 1.45; });
        luego(1.4, () => { npc.raiz.visible = true; anim.modo = "andando"; });
        anim.alFinal = () => {
          anim.modo = "sentandose"; anim.sentarObj = 1; puertaObj = 0;
          luego(.7, () => { anim.modo = "sentado"; cb.sentado(); });
          luego(1.0, cb.saludo);
          luego(1.6, cb.listo);
        };
      },
      salir(fin) {
        esperas.length = 0;
        luego(1.2, () => { anim.sentarObj = 0; anim.modo = "levantandose"; });
        luego(1.9, () => { puertaObj = 1.45; anim.modo = "andando"; anim.s = 0; anim.ruta = RUTA.slice().reverse();
          anim.alFinal = () => { npc.raiz.visible = false; anim.modo = "oculto"; luego(.3, () => { puertaObj = 0; fin(); }); }; });
      },
      reiniciar() { esperas.length = 0; anim.modo = "oculto"; puertaObj = 0; if (npc) npc.raiz.visible = false; },
      hablar(ms) { anim.habla = ms / 1000; },
      saludar() { anim.saludo = 1.8; },
      alejarTablet() { zoomObj = 0; },
    };

    /* ---------- Cámara ---------- */
    const mira = new THREE.Vector3(-.2, 1.0, -1.6), miraObj = new THREE.Vector3();
    const raton = { x: 0, y: 0 }, ratonS = { x: 0, y: 0 };
    addEventListener("pointermove", e => { if (e.pointerType === "mouse") { raton.x = e.clientX / innerWidth - .5; raton.y = e.clientY / innerHeight - .5; } });
    let despX = 0, despY = 0;
    function ajustar() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.fov = w / h < 1 ? 64 : w / h < 1.3 ? 54 : 45;
      camera.updateProjectionMatrix();
    }
    addEventListener("resize", ajustar); ajustar();

    /* ---------- Bucle ---------- */
    const reloj3D = new THREE.Clock();
    const tmp = new THREE.Vector3();
    const lerp = THREE.MathUtils.lerp;
    let parpadeo = 3;
    function cuadro() {
      const dt = Math.min(reloj3D.getDelta(), .05) * (window.__vel || 1), t = reloj3D.elapsedTime;
      for (let i = esperas.length - 1; i >= 0; i--) { esperas[i].t -= dt; if (esperas[i].t <= 0) { const f = esperas[i].fn; esperas.splice(i, 1); f(); } }

      // Puerta
      puertaAng = lerp(puertaAng, puertaObj, 1 - Math.exp(-dt * 4));
      bisagra.rotation.y = puertaAng;

      // Reloj de pared
      const d = new Date();
      manH.rotation.z = -((d.getHours() % 12) + d.getMinutes() / 60) / 12 * Math.PI * 2;
      manM.rotation.z = -(d.getMinutes() + d.getSeconds() / 60) / 60 * Math.PI * 2;

      if (npc && npc.raiz.visible) {
        const r = npc.raiz;
        // Caminar por la ruta
        if (anim.modo === "andando") {
          anim.s += dt * 1.15;
          const q = puntoRuta(anim.ruta, anim.s);
          r.position.copy(q.p);
          anim.rumbo = Math.atan2(q.dir.x, q.dir.z);
          if (q.fin || anim.s >= largoRuta(anim.ruta)) { const f = anim.alFinal; anim.alFinal = null; anim.modo = "parado"; f && f(); }
        }
        const andando = anim.modo === "andando";
        anim.andar = lerp(anim.andar, andando ? 1 : 0, 1 - Math.exp(-dt * 8));
        anim.fase += dt * 7.5 * anim.andar;
        // Girar hacia donde va (o hacia ti al sentarse)
        const objetivoRumbo = andando ? anim.rumbo : 0;
        let dif = objetivoRumbo - r.rotation.y; dif = Math.atan2(Math.sin(dif), Math.cos(dif));
        r.rotation.y += dif * (1 - Math.exp(-dt * 7));
        // Sentarse / levantarse
        anim.sentar = lerp(anim.sentar, anim.sentarObj, 1 - Math.exp(-dt * 5));
        const S = anim.sentar;
        if (anim.modo === "sentandose" || anim.modo === "sentado" || anim.modo === "levantandose") {
          r.position.x = lerp(r.position.x, SILLA.x, 1 - Math.exp(-dt * 5));
          r.position.z = lerp(RUTA[RUTA.length - 1].z, SILLA.z, S);
        }
        const sw = Math.sin(anim.fase) * anim.andar;
        npc.pI.art.rotation.x = lerp(sw * .5, -Math.PI / 2, S);
        npc.pD.art.rotation.x = lerp(-sw * .5, -Math.PI / 2, S);
        npc.pI.rodilla.rotation.x = lerp(Math.max(0, -Math.sin(anim.fase)) * .7 * anim.andar, Math.PI / 2, S);
        npc.pD.rodilla.rotation.x = lerp(Math.max(0, Math.sin(anim.fase)) * .7 * anim.andar, Math.PI / 2, S);
        npc.cadera.position.y = lerp(.92 + Math.abs(Math.cos(anim.fase)) * .025 * anim.andar, .55, S);
        npc.torso.rotation.x = lerp(0, -.08, S);
        npc.torso.scale.set(1, 1 + Math.sin(t * 2.2) * .008, 1);
        npc.bI.hombro.rotation.set(lerp(-sw * .45, -.55, S), 0, lerp(-.08, -.12, S));
        npc.bD.hombro.rotation.set(lerp(sw * .45, -.55, S), 0, lerp(.08, .12, S));
        npc.bI.codo.rotation.x = npc.bD.codo.rotation.x = lerp(-.2, -1.0, S);
        npc.bD.codo.rotation.z = 0;
        // Saludo con la mano
        if (anim.saludo > 0) {
          anim.saludo -= dt;
          const k = Math.min(1, anim.saludo * 3, (1.8 - anim.saludo) * 4);
          npc.bD.hombro.rotation.z = lerp(npc.bD.hombro.rotation.z, 2.6, k);
          npc.bD.hombro.rotation.x = lerp(npc.bD.hombro.rotation.x, 0, k);
          npc.bD.codo.rotation.x = lerp(npc.bD.codo.rotation.x, 0, k);
          npc.bD.codo.rotation.z = Math.sin(t * 12) * .45 * k;
        }
        // Hablar y parpadear
        if (anim.habla > 0) { anim.habla -= dt; npc.boca.scale.set(1, 1 + Math.abs(Math.sin(t * 16)) * 2.2, 1); } else npc.boca.scale.set(1, 1, 1);
        parpadeo -= dt; if (parpadeo < 0) parpadeo = 2.5 + Math.random() * 3;
        npc.ojos.scale.y = parpadeo < .12 ? .15 : 1;
        // Mirar a la cámara cuando está sentado
        npc.raiz.getWorldPosition(tmp);
        npc.cabeza.rotation.y = lerp(0, Math.atan2(camera.position.x - tmp.x, camera.position.z - tmp.z), S) + Math.sin(t * .7) * .04 * S;
        npc.cabeza.rotation.x = lerp(0, -.06, S) + Math.sin(t * .9) * .02;
      }

      // Cámara: sigue al personaje mientras camina
      const vertical = innerWidth / innerHeight < 1;
      if (npc && npc.raiz.visible && anim.modo === "andando") {
        const p = npc.raiz.position, k = vertical ? .95 : .55;
        miraObj.set(p.x * k, 1.0, Math.min(p.z, -.9) - .4);
      } else if (npc && npc.raiz.visible) miraObj.set(0, 1.0, -1.6);
      else miraObj.set(-.2, 1.0, -1.6);
      mira.lerp(miraObj, 1 - Math.exp(-dt * 2.2));
      ratonS.x = lerp(ratonS.x, raton.x, 1 - Math.exp(-dt * 3)); ratonS.y = lerp(ratonS.y, raton.y, 1 - Math.exp(-dt * 3));
      camera.position.set(ratonS.x * .25, 1.22 - ratonS.y * .1, vertical ? 1.55 : 1.4);
      camera.lookAt(mira);
      zoom = lerp(zoom, zoomObj, 1 - Math.exp(-dt * 3.5));
      if (zoom > .001) {
        camera.position.lerp(tabletVista, zoom);
        camera.lookAt(tmp.copy(mira).lerp(tabletMira, zoom));
      }
      pantallaTab.color.setScalar(.88 + Math.sin(t * 3) * .12);

      // Dejar sitio a la pantallita de la llamada
      const ancho = $("pantalla").offsetWidth;
      const objX = enLlamada && !vertical ? ancho / 2 + innerWidth * .015 : 0;
      const objY = vertical ? innerHeight * (enLlamada ? .2 : .14) : 0;
      despX = lerp(despX, objX, 1 - Math.exp(-dt * 4)); despY = lerp(despY, objY, 1 - Math.exp(-dt * 4));
      if (Math.abs(despX) + Math.abs(despY) > .5) camera.setViewOffset(innerWidth, innerHeight, despX, despY, innerWidth, innerHeight);
      else camera.clearViewOffset();

      if (!(visorAbierto && zoom > .97)) renderer.render(scene, camera);

      // Pista sobre la tablet
      const pista = $("pista");
      if (estado === "libre" && !visorAbierto && zoom < .05) {
        tmp.set(.2, 1.0, .06).project(camera);
        pista.style.transform = `translate(${(tmp.x * .5 + .5) * innerWidth - pista.offsetWidth / 2}px, ${(-tmp.y * .5 + .5) * innerHeight - pista.offsetHeight}px)`;
        pista.classList.add("ver");
      } else pista.classList.remove("ver");

      // Bocadillo pegado a la cabeza
      if (bocadilloOn && npc) {
        npc.cabeza.getWorldPosition(tmp); tmp.y += .2; tmp.x += .12;
        tmp.project(camera);
        const el = $("bocadillo");
        let x = (tmp.x * .5 + .5) * innerWidth, y = (-tmp.y * .5 + .5) * innerHeight - el.offsetHeight;
        x = Math.max(10, Math.min(x, innerWidth - el.offsetWidth - 10)); y = Math.max(10, y);
        el.style.transform = `translate(${x}px, ${y}px)`;
      }
      requestAnimationFrame(cuadro);
    }
    requestAnimationFrame(cuadro);
    $("cargando").classList.add("fuera");
    escena3D = api;
  }
</script>
</body>
</html>

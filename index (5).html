<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Oficina</title>
<meta name="theme-color" content="#1f2937">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1f2937; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --panel: #1a1d24; --text: #e5e7eb; --muted: #9ca3af;
      --border: #2a2f3a; --accent: #3b82f6; --accent-text: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 18px; margin: 0 8px 0 0; white-space: nowrap; }
  nav { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  nav button[aria-selected="true"] {
    background: var(--accent); color: var(--accent-text); border-color: var(--accent);
  }
  .aparte {
    margin-left: auto; font-size: 13px; color: var(--accent); text-decoration: none; white-space: nowrap;
  }
  main { flex: 1; position: relative; }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: var(--panel); display: none;
  }
  iframe.activo { display: block; }
  .vacio {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 16px; color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <h1>🏢 Mi Oficina</h1>
  <nav id="pestanas" role="tablist"></nav>
  <a id="aparte" class="aparte" target="_blank" rel="noopener">Abrir aparte ↗</a>
</header>
<main id="zona">
  <div class="vacio" id="vacio">Elige un asistente arriba.</div>
</main>

<script>
  // ==========================================================
  //  CONFIGURA AQUÍ TUS 4 ASISTENTES
  //  Cambia solo lo que está entre comillas en "url".
  //  Si el asistente está en la misma página de GitHub, puedes
  //  poner la ruta corta, por ejemplo: "inventarios.html"
  // ==========================================================
  const ASISTENTES = [
    { id: "pedidos",  nombre: "🛋️ Pedidos",  url: "https://nre130826-maker.github.io/asistente-pedidos/" },
    { id: "bodega",   nombre: "📦 Bodega",   url: "https://nre130826-maker.github.io/asistente-bodega/" },
    { id: "personal", nombre: "🧑‍💼 Personal", url: "https://nre130826-maker.github.io/asistente-voz-personal-DAN-/" },
    // Cuando tengas el de tutoriales, quita las dos barras // de la línea de abajo y pon su dirección:
    // { id: "tutoriales", nombre: "📘 Tutoriales AppSheet", url: "https://nre130826-maker.github.io/NOMBRE-DEL-REPO/" },
  ];
  // ==========================================================

  const nav = document.getElementById("pestanas");
  const zona = document.getElementById("zona");
  const aparte = document.getElementById("aparte");
  const vacio = document.getElementById("vacio");
  const marcos = {};

  function abrir(a) {
    // Carga cada asistente solo la primera vez; luego lo mantiene vivo
    // para que no pierdas la conversación al cambiar de pestaña.
    if (!marcos[a.id]) {
      const f = document.createElement("iframe");
      f.src = a.url;
      f.title = a.nombre;
      f.allow = "microphone; camera; autoplay; clipboard-read; clipboard-write";
      zona.appendChild(f);
      marcos[a.id] = f;
    }
    vacio.style.display = "none";
    Object.values(marcos).forEach(m => m.classList.remove("activo"));
    marcos[a.id].classList.add("activo");
    nav.querySelectorAll("button").forEach(b =>
      b.setAttribute("aria-selected", b.dataset.id === a.id));
    aparte.href = a.url;
    try { localStorage.setItem("oficina-ultimo", a.id); } catch (e) {}
  }

  ASISTENTES.forEach(a => {
    const b = document.createElement("button");
    b.textContent = a.nombre;
    b.dataset.id = a.id;
    b.setAttribute("role", "tab");
    b.onclick = () => abrir(a);
    nav.appendChild(b);
  });

  let ultimo = null;
  try { ultimo = localStorage.getItem("oficina-ultimo"); } catch (e) {}
  abrir(ASISTENTES.find(a => a.id === ultimo) || ASISTENTES[0]);
</script>
</body>
</html>
